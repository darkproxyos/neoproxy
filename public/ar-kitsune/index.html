<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AR Kitsune Mask 3D — NeoProxy</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #container {
    position: relative;
    transform-origin: center center;
  }
  #video, #renderCanvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #renderCanvas { touch-action: none; outline: none; }

  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 20;
    color: #39ff14; font-size: 13px; letter-spacing: 1px;
    text-shadow: 0 0 6px #39ff14;
    pointer-events: none;
  }
  #startBtn {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 20; background: #0f0f0f; color: #39ff14;
    border: 1px solid #39ff14; padding: 12px 28px; font-family: inherit;
    font-size: 14px; letter-spacing: 2px; cursor: pointer; border-radius: 4px;
  }
  #startBtn:active { background: #39ff14; color: #000; }

  #switchBtn {
    position: fixed; bottom: 24px; right: 20px;
    z-index: 20; background: #0f0f0f; color: #39ff14;
    border: 1px solid #39ff14; width: 52px; height: 52px;
    border-radius: 50%; font-size: 22px; display: none;
    align-items: center; justify-content: center; cursor: pointer;
  }
  #switchBtn:active { background: #39ff14; color: #000; }

  #calibToggle {
    position: fixed; top: 12px; right: 12px; z-index: 21;
    background: #0f0f0f; color: #39ff14; border: 1px solid #39ff14;
    width: 34px; height: 34px; border-radius: 4px; font-size: 16px;
    cursor: pointer;
  }
  #calibPanel {
    position: fixed; top: 54px; right: 12px; z-index: 21;
    background: rgba(10,10,10,0.88); border: 1px solid #39ff14;
    color: #39ff14; padding: 10px 12px; font-size: 11px;
    width: 200px; border-radius: 6px; display: none;
  }
  #calibPanel label { display: block; margin-top: 8px; }
  #calibPanel .row { display: flex; align-items: center; gap: 6px; }
  #calibPanel input[type=range] { flex: 1; accent-color: #39ff14; }
  #calibPanel .val { width: 40px; text-align: right; font-size: 10px; }
  #calibPanel button {
    margin-top: 10px; width: 100%; background: #0f0f0f; color: #39ff14;
    border: 1px solid #39ff14; padding: 6px; font-family: inherit; cursor: pointer;
  }
  #calibPanel .chk { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
</style>
</head>
<body>
  <div id="hud">INICIALIZANDO...</div>
  <div id="debugLine" style="position:fixed;top:34px;left:12px;z-index:20;color:#39ff14;font-size:11px;opacity:0.8;pointer-events:none;"></div>
  <button id="startBtn">ACTIVAR CÁMARA</button>
  <button id="switchBtn" title="Cambiar cámara">🔄</button>
  <button id="calibToggle" title="Calibración">⚙</button>

  <div id="calibPanel">
    <label>Escala
      <div class="row"><input id="sScale" type="range" min="0.02" max="0.8" step="0.001" value="0.226"><span class="val" id="vScale">0.226</span></div>
    </label>
    <label>Offset X
      <div class="row"><input id="sOffX" type="range" min="-0.3" max="0.3" step="0.001" value="0"><span class="val" id="vOffX">0.000</span></div>
    </label>
    <label>Offset Y (vertical)
      <div class="row"><input id="sOffY" type="range" min="-0.3" max="0.3" step="0.001" value="-0.022"><span class="val" id="vOffY">-0.022</span></div>
    </label>
    <label>Offset Z (profundidad)
      <div class="row"><input id="sOffZ" type="range" min="-0.3" max="0.3" step="0.001" value="0"><span class="val" id="vOffZ">0.000</span></div>
    </label>
    <div class="chk">
      <input id="cInvYaw" type="checkbox" checked>
      <label for="cInvYaw" style="margin:0">Invertir giro Izq/Der (probá este si al mirar a la derecha gira a la izquierda)</label>
    </div>
    <div class="chk">
      <input id="cInvPitch" type="checkbox" checked>
      <label for="cInvPitch" style="margin:0">Invertir giro Arriba/Abajo</label>
    </div>
    <div class="chk">
      <input id="cInvRoll" type="checkbox">
      <label for="cInvRoll" style="margin:0">Invertir inclinación lateral (ladear cabeza)</label>
    </div>
    <button id="resetCalib">Reiniciar valores</button>
  </div>

  <div id="stage">
    <div id="container">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="renderCanvas"></canvas>
    </div>
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
