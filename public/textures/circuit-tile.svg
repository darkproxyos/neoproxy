<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <!--
    Tile de fondo tipo placa de circuito, reemplaza la grilla plana anterior.
    Las líneas "bus" (H1/H2/V1/V2) corren de borde a borde para que al
    repetirse como background-image formen trazos continuos entre tiles;
    el resto de los detalles (codos, chip, hex, nodos) vive lejos de los
    bordes a propósito, para no generar costuras visibles al repetir.
    Color y alpha pensados para quedar casi subliminales una vez que
    .tech-grid le aplica su propia opacity (~0.5, baja en modo calma).
  -->
  <g stroke="#00d4ff" fill="none" stroke-width="1">
    <line x1="0" y1="46" x2="260" y2="46" stroke-opacity="0.55" />
    <line x1="0" y1="214" x2="260" y2="214" stroke-opacity="0.5" />
    <line x1="38" y1="0" x2="38" y2="260" stroke-opacity="0.5" />
    <line x1="222" y1="0" x2="222" y2="260" stroke-opacity="0.45" />

    <path d="M70,46 L70,100 L140,100 L140,150" stroke-opacity="0.4" />
    <path d="M38,160 L90,160 L90,214" stroke-opacity="0.38" />
    <path d="M140,150 L186,150 L186,120" stroke-opacity="0.32" />
    <path d="M222,70 L196,70 L196,46" stroke-opacity="0.32" />

    <rect x="150" y="60" width="46" height="28" rx="2" stroke-opacity="0.45" />
    <line x1="150" y1="68" x2="140" y2="68" stroke-opacity="0.4" />
    <line x1="150" y1="80" x2="140" y2="80" stroke-opacity="0.4" />
    <line x1="196" y1="68" x2="206" y2="68" stroke-opacity="0.4" />
    <line x1="196" y1="80" x2="206" y2="80" stroke-opacity="0.4" />

    <polygon points="195,134 207.9,141.5 207.9,156.5 195,164 182.1,156.5 182.1,141.5"
      stroke-opacity="0.35" />

    <circle cx="38" cy="46" r="6" stroke-opacity="0.5" />
    <circle cx="38" cy="46" r="10" stroke-opacity="0.28" />
  </g>

  <g fill="#00d4ff">
    <circle cx="70" cy="100" r="2.4" fill-opacity="0.55" />
    <circle cx="140" cy="100" r="2.4" fill-opacity="0.55" />
    <circle cx="140" cy="150" r="2.4" fill-opacity="0.5" />
    <circle cx="90" cy="160" r="2.2" fill-opacity="0.5" />
    <circle cx="186" cy="120" r="2.2" fill-opacity="0.42" />
    <circle cx="196" cy="46" r="2.2" fill-opacity="0.42" />
    <circle cx="222" cy="214" r="3" fill-opacity="0.5" />
    <circle cx="170" cy="190" r="1.8" fill-opacity="0.35" />
    <circle cx="50" cy="180" r="1.8" fill-opacity="0.32" />
  </g>
</svg>
