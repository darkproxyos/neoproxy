<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NeoProxy // Realidad Aumentada</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #container {
    position: relative;
    transform-origin: center center;
  }
  #video, #ambient, #canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #ambient {
    mix-blend-mode: screen;
  }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 20;
    color: #ff2fd0; font-size: 13px; letter-spacing: 1px;
    text-shadow: 0 0 6px #ff2fd0;
    pointer-events: none;
  }
  #startBtn {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 20; background: #0f0f0f; color: #38d6ff;
    border: 1px solid #38d6ff; padding: 12px 28px; font-family: inherit;
    font-size: 14px; letter-spacing: 2px; cursor: pointer; border-radius: 4px;
  }
  #startBtn:active { background: #38d6ff; color: #000; }
  #switchBtn {
    position: fixed; bottom: 24px; right: 20px;
    z-index: 20; background: #0f0f0f; color: #ff2fd0;
    border: 1px solid #ff2fd0; width: 52px; height: 52px;
    border-radius: 50%; font-size: 22px; display: none;
    align-items: center; justify-content: center; cursor: pointer;
  }
  #styleBtn {
    position: fixed; bottom: 24px; right: 84px;
    z-index: 20; background: #0f0f0f; color: #00d4ff;
    border: 1px solid #00d4ff; padding: 12px 18px; font-family: inherit;
    font-size: 11px; letter-spacing: 2px; cursor: pointer; border-radius: 4px;
  }
  #styleBtn:active { background: #00d4ff; color: #000; }
  #styleLabel {
    position: fixed; top: 12px; right: 12px; z-index: 20;
    color: #00d4ff; font-size: 11px; letter-spacing: 2px;
    text-shadow: 0 0 6px #00d4ff; pointer-events: none; text-align: right;
  }
</style>
</head>
<body>
  <div id="hud">LISTO — TOCÁ "ACTIVAR CÁMARA"</div>
  <div id="styleLabel"></div>
  <button id="startBtn">ACTIVAR CÁMARA</button>
  <button id="switchBtn" title="Cambiar cámara">🔄</button>
  <button id="styleBtn" title="Cambiar estilo">🎨 ESTILO</button>
  <div id="stage">
    <div id="container">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="ambient"></canvas>
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script type="module" src="/realidad-aumentada/js/main.js"></script>
</body>
</html>
